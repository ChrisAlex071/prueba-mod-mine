name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlayerClones-2.0.0-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          build-root-directory: PlayerClones-2.0.0-alpha
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: player-clones-jar
          path: PlayerClones-2.0.0-alpha/build/libs/*.jar
